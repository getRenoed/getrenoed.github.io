<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>...</title>
  
  <!-- Redirección tras 2.5 segundos -->
  <meta http-equiv="refresh" content="5.0;url=https://renoquintero.com/soulfirenation">

  <style>
    body {
      background-color: #000000;
      margin: 0;
      padding: 0;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      color: #333333;
      font-family: monospace;
      cursor: pointer;
    }

    .flame-wrapper {
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .tiny-flame {
      width: 64px; 
      height: auto;
      image-rendering: pixelated;
      image-rendering: crisp-edges;
      filter: drop-shadow(0 0 12px rgba(0, 140, 255, 0.6));
    }

    .fallback {
      position: absolute;
      bottom: 20px;
      font-size: 11px;
      opacity: 0.3;
    }

    .fallback a {
      color: #666666;
      text-decoration: none;
    }

    .fallback a:hover {
      color: #0088ff;
    }
  </style>
</head>
<body>

  <!-- Audio -->
<audio id="campfire" src="https://minecraft.wiki/images/Campfire_crackle3.ogg?7aad3&format=original" preload="auto"></audio>
<div class="flame-wrapper">
    <img id="flame" class="tiny-flame" src="https://renoquintero.com/soulfirenation/assets/blue-flame.gif" alt="SFN Crown burning in blue flame" />
  </div>

  <div class="fallback">
    <a href="https://renoquintero.com/soulfirenation">skip &rarr;</a>
  </div>

<script>
  const flameImg = document.getElementById('flame');
  const audio = document.getElementById('campfire');

  if (audio) {
    audio.volume = 0.6;

    // Función que arranca el conteo de 2.5s SOLO cuando el audio empieza a sonar
    function startSplashSequence() {
      // Reinicia GIF
      if (flameImg) {
        flameImg.src = '/soulfirenation/assets/blue-flame.gif?' + Date.now();
      }

      // Transición de audio
      setTimeout(function() {
        let fadeOut = setInterval(function() {
          if (audio.volume > 0.05) {
            audio.volume -= 0.05;
          } else {
            audio.volume = 0;
            clearInterval(fadeOut);
          }
        }, 50);
      }, 2000);

      // Redirección
      setTimeout(function() {
        window.location.replace('https://renoquintero.com/soulfirenation');
      }, 3500);
    }

    // Intentar reproducir el audio
    const playPromise = audio.play();

    if (playPromise !== undefined) {
      playPromise.then(() => {
        // El audio cargó y arrancó -> Inicia la secuencia de 2.5s
        startSplashSequence();
      }).catch(() => {
        // Autoplay bloqueado por el navegador -> Arranca al primer clic o tecla
        const startAudioOnInteraction = () => {
          audio.play().then(() => {
            startSplashSequence();
          });
          document.removeEventListener('click', startAudioOnInteraction);
          document.removeEventListener('keydown', startAudioOnInteraction);
        };
        document.addEventListener('click', startAudioOnInteraction);
        document.addEventListener('keydown', startAudioOnInteraction);

        // Respaldo: Si no interactúa en 3.5s, redirige para no trabar la navegación
        setTimeout(function() {
          window.location.replace('https://renoquintero.com/soulfirenation');
        }, 3500);
      });
    }
  } else {
    // Respaldo directo si no existe el elemento de audio
    setTimeout(function() {
      window.location.replace('https://renoquintero.com/soulfirenation');
    }, 2500);
  }
</script>

</body>
</html>
