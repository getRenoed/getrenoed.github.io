<!DOCTYPE html>
<html lang="es">
<head>
  <link rel="preload" href="assets/blue-flame.gif" as="image">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>...</title>
  
  <!-- Redirección de respaldo tras 5 segundos -->
  <meta http-equiv="refresh" content="5.0;url=https://renoquintero.com/soulfirenation">

  <style>
    body {
      background-color: #000000;
      margin: 0;
      padding: 0;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      color: #333333;
      font-family: monospace;
      cursor: pointer;
    }

    .flame-wrapper {
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .tiny-flame {
      width: 64px; 
      height: auto;
      image-rendering: pixelated;
      image-rendering: crisp-edges;
      filter: drop-shadow(0 0 12px rgba(0, 140, 255, 0.6));
    }

    .fallback {
      position: absolute;
      bottom: 20px;
      font-size: 11px;
      opacity: 0.3;
    }

    .fallback a {
      color: #666666;
      text-decoration: none;
    }

    .fallback a:hover {
      color: #0088ff;
    }
  </style>
</head>
<body>

  <!-- Audio -->
  <audio id="campfire" src="https://minecraft.wiki/images/Campfire_crackle3.ogg?7aad3&format=original" preload="auto"></audio>
  
  <div class="flame-wrapper">
    <img id="flame" class="tiny-flame" src="assets/blue-flame.gif" alt="SFN Crown burning in blue flame" />
  </div>

  <div class="fallback">
    <a href="https://renoquintero.com/soulfirenation">skip &rarr;</a>
  </div>

<script>
  const audio = document.getElementById('campfire');
  const targetUrl = 'https://renoquintero.com/soulfirenation';

  // Redirigir suavemente tras la secuencia
  function triggerRedirect() {
    if (audio) {
      let fadeOut = setInterval(function() {
        if (audio.volume > 0.05) {
          audio.volume -= 0.05;
        } else {
          audio.volume = 0;
          clearInterval(fadeOut);
        }
      }, 50);
    }
    setTimeout(function() {
      window.location.replace(targetUrl);
    }, 2500);
  }

  // Intentar reproducir audio si el navegador lo permite
  if (audio) {
    audio.volume = 0.6;
    audio.play().then(() => {
      triggerRedirect();
    }).catch(() => {
      // Si el navegador bloquea autoplay, redirige tras 3s de todos modos
      setTimeout(function() {
        window.location.replace(targetUrl);
      }, 3000);
    });
  } else {
    setTimeout(function() {
      window.location.replace(targetUrl);
    }, 2500);
  }
</script>

</body>
</html>
