<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reno Quintero</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .icon-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 40px 30px;
            margin-top: 40px;
            justify-items: center;
            align-items: center;
        }

        .icon-link {
            position: relative;
            display: inline-flex;
            flex-direction: column;
            align-items: center;
            text-decoration: none;
            color: var(--apoyo);
            transition: transform 0.2s ease, color 0.2s ease;
            cursor: url('images/ani_cursor.gif'), pointer;
        }

        .icon-link i, 
        .icon-link svg {
            font-size: 3.5rem;
            width: 3.5rem;
            height: 3.5rem;
            fill: var(--apoyo);
            color: var(--apoyo);
            transition: transform 0.2s ease, color 0.2s ease, fill 0.2s ease, filter 0.2s ease;
        }

        .subdomain-text {
            margin-top: 8px;
            font-family: "Courier New", Courier, monospace;
            font-size: 1.25rem;
            font-weight: bold;
            color: var(--apoyo);
            transition: color 0.2s ease;
            text-align: center;
        }

        .icon-link:hover {
            transform: translateY(-8px);
        }

        .icon-link:hover i,
        .icon-link:hover svg {
            color: var(--acento);
            fill: var(--acento);
            filter: drop-shadow(0 0 8px var(--acento));
        }

        .icon-link:hover .subdomain-text {
            color: var(--principal);
        }

        .icon-link:active {
            transform: translateY(-2px);
        }
    </style>
</head>
<body>

    <div id="container">
        <div class="hero-container">
            <h1><a href="https://renoquintero.com/">Reno Quintero</a></h1>
        </div>
      <h2 style="text-align: center;">
        Jack of all trades!🃏
      </h2>
        <div class="icon-grid">
            <a href="https://renoquintero.com/getrenoed" class="icon-link" rel="noopener noreferrer">
                <i class="fas fa-gamepad" aria-hidden="true"></i>
                <span class="subdomain-text" translate="no">getRenoed</span>
            </a>

            <a href="https://youtu.be/loU-BAVOU3E" class="icon-link" target="_blank" rel="noopener noreferrer">
                <svg viewBox="0 0 512 512" aria-hidden="true">
                    <path d="M496 288H16c-8.8 0-16 7.2-16 16v32c0 8.8 7.2 16 16 16h480c8.8 0 16-7.2 16-16v-32c0-8.8-7.2-16-16-16zM112 416c-35.3 0-64-28.7-64-64s28.7-64 64-64 64 28.7 64 64-28.7 64-64 64zm288 0c-35.3 0-64-28.7-64-64s28.7-64 64-64 64 28.7 64 64-28.7 64-64 64zM432 192H80c-17.7 0-32 14.3-32 32s14.3 32 32 32h352c17.7 0 32-14.3 32-32s-14.3-32-32-32z"/>
                </svg>
                <span class="subdomain-text" translate="no">LongVlog</span>
            </a>

            <a href="#" class="icon-link" rel="noopener noreferrer">
                <i class="fas fa-microphone" aria-hidden="true"></i>
                <span class="subdomain-text" translate="no">Poesía Desangre</span><span class="subdomain-text"> (Pronto!)</span>
            </a>

            <a href="https://www.youtube.com/@reno.quintero" class="icon-link" target="_blank" rel="noopener noreferrer">
                <i class="fas fa-music" aria-hidden="true"></i>
                <span class="subdomain-text">Reno Quintero Music</span>
            </a>
        </div>
    </div>

</body>
</html>
